name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Also prevents a manual workflow_dispatch from building a deployment on another branch.
    if: github.ref == 'refs/heads/main' && github.repository == 'DonytXz/DonytXz.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, validate, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run check && npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'DonytXz/DonytXz.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the main-branch artifact
        id: deployment
        uses: actions/deploy-pages@v5
