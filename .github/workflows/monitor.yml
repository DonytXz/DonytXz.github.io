name: Portfolio availability

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-availability
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.repository == 'DonytXz/DonytXz.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Uses only built-in Node modules; does not install project dependencies.
      - run: npm run check:site
