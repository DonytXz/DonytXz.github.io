name: Update Badges

on:
  schedule:
    # Runs daily at 2:30 AM UTC (after DonytXz/Donytxz profile update)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-badges
  cancel-in-progress: false

jobs:
  update-badges:
    if: github.repository == 'DonytXz/DonytXz.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Sync latest Credly badges and images
        run: node scripts/sync-badges.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/badges src/data/badges.ts
          if git diff --staged --quiet; then
            echo "No badge updates found."
          else
            git commit -m "chore(badges): sync latest Credly badges [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
